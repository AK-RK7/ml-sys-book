<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Harvard CS249R Study Assistant</title>

    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            background: #fafafa;
        }

        h1 {
            text-align: center;
        }

        #chat {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            height: 500px;
            overflow-y: auto;
            background: white;
        }

        .user {
            margin: 15px 0;
            color: #2563eb;
        }

        .assistant {
            margin: 15px 0;
            color: #111827;
        }

        pre {
            white-space: pre-wrap;
            font-family: inherit;
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
        }

        input {
            width: 80%;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        .feedback {
            margin-top: 15px;
        }

        .status {
            color: green;
            margin-left: 10px;
        }

    </style>

</head>

<body>

<h1>Harvard CS249R Study Assistant</h1>

<div id="chat"></div>

<br>

<input
    id="question"
    placeholder="Ask your question..."
>

<button onclick="ask()">
    Send
</button>

<script>

async function ask() {

    const input = document.getElementById("question");
    const question = input.value.trim();

    if (!question)
        return;

    const chat = document.getElementById("chat");

    chat.innerHTML += `
        <div class="user">
            <b>You:</b> ${question}
        </div>
    `;

    chat.innerHTML += `
        <div id="loading">
            Assistant is thinking...
        </div>
    `;

    chat.scrollTop = chat.scrollHeight;

    input.value = "";

    try {

        const response = await fetch("/question", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        if (!response.ok) {
            const text = await response.text();
            throw new Error(text);
        }

        const data = await response.json();

        document.getElementById("loading").remove();

        const conversationId = data.conversation_id;
        const feedbackId = "status-" + conversationId;

        chat.innerHTML += `
            <div class="assistant">

                <b>Assistant:</b>

                <pre>${data.answer}</pre>

                ${
                    data.sources && data.sources.length
                    ?
                    `
                    <b>Sources</b>

                    <ul>
                        ${data.sources.map(
                            s => `<li>${s}</li>`
                        ).join("")}
                    </ul>
                    `
                    :
                    ""
                }

                <div class="feedback">

                    <button
                        onclick="sendFeedback(
                            '${conversationId}',
                            1,
                            this
                        )">
                        👍 Good
                    </button>

                    <button
                        onclick="sendFeedback(
                            '${conversationId}',
                            -1,
                            this
                        )">
                        👎 Bad
                    </button>

                    <span
                        id="${feedbackId}"
                        class="status">
                    </span>

                </div>

            </div>
        `;

        chat.scrollTop = chat.scrollHeight;

    }

    catch(err) {

        const loading = document.getElementById("loading");

        if (loading)
            loading.remove();

        chat.innerHTML += `
            <div class="assistant">
                <b>Error:</b>
                ${err}
            </div>
        `;
    }

}

async function sendFeedback(
    conversationId,
    feedback,
    button
) {

    const status = document.getElementById(
        "status-" + conversationId
    );

    status.innerHTML = "Saving...";

    try {

        const response = await fetch(
            "/feedback",
            {
                method: "POST",
                headers: {
                    "Content-Type":"application/json"
                },
                body: JSON.stringify({
                    conversation_id: conversationId,
                    feedback: feedback
                })
            }
        );

        const result = await response.json();

        if (response.ok) {

            status.innerHTML = "✓ Feedback saved";

            const buttons =
                button.parentElement.querySelectorAll("button");

            buttons.forEach(btn => btn.disabled = true);

        }

        else {

            status.innerHTML = result.error;

        }

    }

    catch {

        status.innerHTML = "Failed to save";

    }

}

document
.getElementById("question")
.addEventListener(
    "keypress",
    function(event){

        if(event.key === "Enter"){
            ask();
        }

    }
);

</script>

</body>
</html>
