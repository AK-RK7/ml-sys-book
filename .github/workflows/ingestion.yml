name: Data Ingestion

on:
  workflow_dispatch:
  push:
    paths:
      - "data/raw/**"

jobs:
  ingest:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run ingestion
        run: uv run python -m study_assistant.ingest