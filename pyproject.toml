[project]
name = "ml-sys-book"
version = "0.1.0"
description = "Harvard CS249R Machine Learning Systems Study Assistant (RAG)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "openai>=1.50,<2.0",
    "scikit-learn>=1.5,<2.0",
    "rank-bm25>=0.2,<0.3",
    "sentence-transformers>=3.0,<6.0",
    "torch==2.7.1+cpu",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "flask>=3.0,<4.0",
    "psycopg2-binary>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "gunicorn>=23.0,<24.0",
    "tiktoken>=0.7,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    "tqdm>=4.66,<5.0",
    "jupyter>=1.1,<2.0",
    "notebook==7.1.2",
    "ipywidgets>=8.1,<9.0",
    "pgcli>=4.1,<5.0",
    "questionary>=2.1,<3.0",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["study_assistant"]
